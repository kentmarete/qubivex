[workspace]
resolver = "3"
members = ["crates/qubivex-core", "crates/qubivex-hardware", "crates/qubivex-model", "crates/qubivex-compute", "crates/qubivex-backend-cpu", "crates/qubivex-tokenizer", "crates/qubivex-runtime", "crates/qubivex-expert-stream", "crates/qubivex-arch", "crates/qubivex-memory", "crates/qubivex-backend-metal", "apps/cli", "xtask"]
default-members = ["crates/qubivex-core", "crates/qubivex-hardware", "crates/qubivex-model", "crates/qubivex-compute", "crates/qubivex-backend-cpu", "crates/qubivex-tokenizer", "crates/qubivex-runtime", "crates/qubivex-expert-stream", "crates/qubivex-arch", "crates/qubivex-memory", "crates/qubivex-backend-metal", "apps/cli", "xtask"]
# Spikes are standalone packages with their own lock files (their dependencies are not
# product dependencies until an ADR accepts them).
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/kentmarete/qubivex"
publish = false

[workspace.dependencies]
# Internal crates.
qubivex-core = { path = "crates/qubivex-core", version = "0.1.0" }
qubivex-hardware = { path = "crates/qubivex-hardware", version = "0.1.0" }
qubivex-model = { path = "crates/qubivex-model", version = "0.1.0" }
qubivex-compute = { path = "crates/qubivex-compute", version = "0.1.0" }
qubivex-backend-cpu = { path = "crates/qubivex-backend-cpu", version = "0.1.0" }
qubivex-tokenizer = { path = "crates/qubivex-tokenizer", version = "0.1.0" }
qubivex-runtime = { path = "crates/qubivex-runtime", version = "0.1.0" }
qubivex-expert-stream = { path = "crates/qubivex-expert-stream", version = "0.1.0" }
qubivex-arch = { path = "crates/qubivex-arch", version = "0.1.0" }
qubivex-memory = { path = "crates/qubivex-memory", version = "0.1.0" }
qubivex-backend-metal = { path = "crates/qubivex-backend-metal", version = "0.1.0" }

# Third-party versions are declared here once (ADR-001); members use `{ workspace = true }`.
# Requirements stay at the oldest version we need. Exact versions live in Cargo.lock,
# which resolver 3 fills with the newest releases compatible with `rust-version`.
clap = { version = "4.5", features = ["derive"] }
# Kernel benchmarks only (dev-dependency); no plotters, no HTML reports.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
loom = "0.7.2"
minijinja = { version = "3.0", default-features = false, features = ["builtins", "fuel", "serde"] }
minijinja-contrib = { version = "3.0", features = ["pycompat"] }
proptest = "1.6"
rayon = "1.10"
# Pure Rust: no Oniguruma (C) or esaxx C++ code.
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
# Safe syscall wrappers (statvfs, O_DIRECT, F_NOCACHE, fadvise), so qubivex-hardware needs no unsafe.
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[workspace.lints.rust]
# Opted out per crate with #![allow(unsafe_code)] in backend-cpu, expert-stream and
# backend-{cuda,vulkan,metal} only (RUST_GUIDELINES §3).
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
cast_possible_truncation = "warn"
float_cmp = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
# The server catches per-request panics at the gateway boundary (ADR-001).
panic = "unwind"
