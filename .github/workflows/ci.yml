name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux x86-64 is the first production target; macOS arm64 is the local loop.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
      - name: Dependency direction and model-name guard
        run: cargo xtask check

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  loom:
    name: loom (expert store)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg loom -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked -p qubivex-expert-stream --test loom
      - run: cargo test --release --locked -p qubivex-scheduler --test loom

  tsan:
    name: ThreadSanitizer (scheduler, gateway, store)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=thread
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-06
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --locked
          -p qubivex-scheduler -p qubivex-api -p qubivex-expert-stream -p qubivex-runtime
          --test scheduler --test concurrency --test gateway --test store --test prefetch
          --test requests

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
