name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux x86-64 is the first production target; macOS arm64 is the local loop.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
      - name: Dependency direction and model-name guard
        run: cargo xtask check

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  loom:
    name: loom (expert store)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg loom -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked -p qubivex-expert-stream --test loom
      - run: cargo test --release --locked -p qubivex-scheduler --test loom

  tsan:
    name: ThreadSanitizer (scheduler, gateway, store)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=thread
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/tsan-suppressions.txt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-06
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --locked --no-fail-fast
          -p qubivex-scheduler -p qubivex-api -p qubivex-expert-stream -p qubivex-runtime
          --test scheduler --test concurrency --test gateway --test store --test prefetch
          --test requests --test prefix

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t qubivex .
      - name: Refuses to listen beyond loopback without a key
        run: |
          out=$(timeout 60 docker run --rm qubivex 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "without an API key"
      - name: Serve the fixture model, call it, and stop with SIGTERM
        run: |
          docker run -d --name qubivex --read-only -p 127.0.0.1:8080:8080 \
            -e QUBIVEX_API_KEY=sk-ci qubivex \
            serve --listen 0.0.0.0:8080 --dir /usr/share/qubivex/models --model olmoe-tiny
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/models)" = 401
          curl -sf http://127.0.0.1:8080/v1/chat/completions \
            -H 'Authorization: Bearer sk-ci' -H 'content-type: application/json' \
            -d '{"model":"olmoe-tiny","messages":[{"role":"user","content":"Hello"}],"max_tokens":4}'
          docker stop -t 45 qubivex
          docker logs qubivex
          test "$(docker inspect -f '{{.State.ExitCode}}' qubivex)" = 0

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
