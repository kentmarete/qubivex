# cargo-deny configuration. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each ignored advisory names the crate, why it is acceptable, and when to revisit.
ignore = [
    # `paste` is unmaintained (no vulnerability). It is a compile-time macro used by
    # `tokenizers`; nothing of it runs in QUBIVEX. Revisit when `tokenizers` drops it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro via tokenizers; no vulnerability" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list anticipates later dependencies; do not warn while one is unused.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
